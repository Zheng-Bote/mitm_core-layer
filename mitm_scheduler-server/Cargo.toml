[package]
name = "mitm-scheduler-server"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "MitM scheduler server - core layer"
homepage = "https://github.com/Zheng-Bote/mitm-3"
repository = "https://github.com/Zheng-Bote/mitm-3/release/latest"
documentation = "https://github.com/Zheng-Bote/mitm-3/docs"
keywords = ["mitm-3", "core-layer", "scheduler-server"]

[dependencies]
mitm_common = { path = "../mitm_common" }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
cron = "0.12"
chrono = "0.4"
