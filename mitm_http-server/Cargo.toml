[package]
name = "mitm-http-server"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "MitM HTTP server (Start-Programm) - core layer"
homepage = "https://github.com/Zheng-Bote/mitm-3"
repository = "https://github.com/Zheng-Bote/mitm-3/release/latest"
documentation = "https://github.com/Zheng-Bote/mitm-3/docs"
keywords = ["mitm-3", "core-layer", "http-server"]

[dependencies]
mitm_common = { path = "../mitm_common" }
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
base64 = "0.22"
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8.5"
